# Laptop RTX 5050 (8GB, Windows/WDDM). Proves the pipeline end to end on tiny data.
model:
  policy: Qwen/Qwen3-0.6B-Base
  reward: Qwen/Qwen3-0.6B-Base
  load_in_4bit: true

lora: {r: 16, alpha: 32}

train:
  max_seq_len: 1024
  batch_size: 1
  grad_accum: 16
  optim: paged_adamw_8bit
  gradient_checkpointing: true

data:
  stage1_examples: 200
  stage2_prompts: 100
  stage3_prompts: 100

# scripts/bench_generate.py, 32 prompts x 768 tokens: batch 16 dynamic = 2.53 s/prompt, 4.9 GB peak.
# 32 dynamic is 11% faster but sits at the 6.3 GB cap (one long-prompt batch ran at 9.3 s/prompt);
# static cache is fragmentation-free but ~40% slower without torch.compile (no Triton on Windows).
generation: {backend: hf, batch_size: 16, cache: dynamic}

grpo:
  steps: 50
  num_generations: 4
  max_completion_length: 384
  use_vllm: false

judge:
  base_url: http://127.0.0.1:11434/v1
  model: qwen3.5:4b           # the model installed in Ollama on the laptop
  reasoning_effort: none      # without it Qwen3.5 thinks for 600+ tokens per call
  concurrency: 1              # Ollama runs one request at a time (OLLAMA_NUM_PARALLEL=1)

eval:
  gsm8k_n: 200                # debug only checks the harness runs, not the gate

runtime:
  keep_awake: true
  pin_p_cores: true
  p_core_mask: 0x0FFF
  above_normal_priority: true
  cuda_memory_fraction: 0.8
